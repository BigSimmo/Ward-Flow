      const SHOTS = {};
      /* Viewer: page picker, device frame, current-app comparison, review notes. */
      const ORDER = [
        [
          "Coordinator",
          [
            ["home", "Home"],
            ["capacity", "Capacity"],
            ["movements", "Movements"],
            ["waiting", "Waiting"],
            ["eds", "All EDs"],
            ["referrals", "Referrals"],
            ["handover", "Handover"],
          ],
        ],
        [
          "Desks",
          [
            ["ward", "My ward"],
            ["stays", "Stays and discharges"],
            ["edboard", "ED board"],
            ["transport", "Transport"],
          ],
        ],
        [
          "Work and reports",
          [
            ["patients", "Patients"],
            ["discharges", "Discharges"],
            ["wards", "All wards"],
            ["statistics", "Statistics"],
          ],
        ],
      ];
      const DEVICES = {
        desktop: [1440, "Desktop"],
        laptop: [1280, "Laptop"],
        tablet: [768, "Tablet"],
        phone: [390, "Phone"],
      };
      const DEV_H = { tablet: 1024, phone: 844 };
      const state = { page: "capacity", device: "desktop", view: "mock", fit: true };
      try {
        const s = JSON.parse(localStorage.getItem("wf-core-mock") || "{}");
        Object.assign(state, { device: s.device || state.device, fit: s.fit ?? true });
      } catch (e) {
        /* storage unavailable */
      }
      const ids = ORDER.flatMap(([, l]) => l.map(([id]) => id));
      if (ids.includes(location.hash.slice(1))) state.page = location.hash.slice(1);

      const $ = (q) => document.querySelector(q);
      function save() {
        try {
          localStorage.setItem("wf-core-mock", JSON.stringify({ device: state.device, fit: state.fit }));
        } catch (e) {
          /* ignore */
        }
      }
      function label(id) {
        for (const [, l] of ORDER) for (const [i, n] of l) if (i === id) return n;
        return id;
      }

      function shotFor(id, dev) {
        const w = DEVICES[dev][0];
        const key = `${id}-${w}`;
        if (SHOTS[key]) return [SHOTS[key], w, false];
        const alt = w <= 560 ? `${id}-390` : `${id}-1440`;
        return SHOTS[alt] ? [SHOTS[alt], w <= 560 ? 390 : 1440, true] : [null, w, false];
      }

      function renderPicker() {
        $("#pages").innerHTML = ORDER.map(
          ([g, l]) =>
            `<span class="grp">${g}</span>` +
            l
              .map(
                ([id, n]) =>
                  `<button type="button" data-page="${id}" ${id === state.page ? 'aria-current="page"' : ""}>${n}</button>`,
              )
              .join(""),
        ).join("");
        document
          .querySelectorAll("[data-dev]")
          .forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.dev === state.device)));
        document
          .querySelectorAll("[data-view]")
          .forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
        document
          .querySelectorAll("[data-fit]")
          .forEach((b) => b.setAttribute("aria-pressed", String((b.dataset.fit === "fit") === state.fit)));
      }

      function renderNotes() {
        const n = NOTES[state.page];
        if (!n) {
          $("#notes").innerHTML = "";
          return;
        }
        const li = (arr) => arr.map((x) => `<li>${x}</li>`).join("");
        $("#notes").innerHTML = `<h2>${label(state.page)}</h2><p>${n.role}</p>
    <div><h3>What was wrong</h3><ol>${li(n.issues)}</ol></div>
    <div><h3>What the mock-up changes</h3><ol>${li(n.fixes)}</ol></div>
    ${n.keep ? `<div><h3>Kept as it is</h3><p class="keep">${n.keep}</p></div>` : ""}
    <p class="ground">${GROUND}</p>`;
      }

      function renderStage() {
        const [w] = DEVICES[state.device];
        const isFrame = state.device === "phone" || state.device === "tablet";
        let inner,
          width = w,
          note = "";
        if (state.view === "now") {
          const [src, sw, approx] = shotFor(state.page, state.device);
          width = sw;
          inner = src
            ? `<img onload="fit()" src="${src}" alt="Screenshot of the current ${label(state.page)} page at ${sw} pixels wide" style="display:block;width:${sw}px;max-width:none">`
            : `<div style="padding:40px;width:${sw}px" class="muted">No screenshot at this width.</div>`;
          if (approx) note = `No ${w}px screenshot for this page; showing ${sw}px.`;
        } else {
          inner = PAGES[state.page]();
        }
        const h = isFrame ? DEV_H[state.device] : null;
        $("#stage").innerHTML =
          `<div class="device-wrap"><div class="device ${isFrame ? "is-" + state.device : ""}" style="width:${width}px">
     <div class="app-scroll" style="${h ? `height:${h}px` : ""}">${inner}</div></div></div>`;
        $("#stagenote").textContent = note;
        fit();
      }

      function fit() {
        const wrap = $("#stage .device-wrap"),
          dev = $("#stage .device");
        if (!wrap || !dev) return;
        const extra = dev.classList.contains("is-phone") || dev.classList.contains("is-tablet") ? 40 : 0;
        const avail = $("#stage").clientWidth || 1;
        const w = dev.offsetWidth + extra;
        const s = state.fit ? Math.min(1, avail / w) : 1;
        dev.style.transform = `scale(${s})`;
        wrap.style.width = `${w * s}px`;
        wrap.style.height = `${(dev.offsetHeight + extra) * s}px`;
        $("#stage").classList.toggle("fit", state.fit);
        $("#scale").textContent = `${Math.round(s * 100)}%`;
      }

      function go() {
        renderPicker();
        renderNotes();
        renderStage();
      }

      document.addEventListener("click", (e) => {
        const t = e.target.closest("button,[data-toggle] span,[data-go]");
        if (!t) return;
        if (t.dataset.page) {
          state.page = t.dataset.page;
          history.replaceState(null, "", "#" + state.page);
          go();
          window.scrollTo({ top: 0 });
        } else if (t.dataset.dev) {
          state.device = t.dataset.dev;
          save();
          go();
        } else if (t.dataset.view) {
          state.view = t.dataset.view;
          go();
        } else if (t.dataset.fit) {
          state.fit = t.dataset.fit === "fit";
          save();
          fit();
          renderPicker();
        } else if (t.dataset.theme !== undefined) {
          const v = t.dataset.theme;
          if (v) document.documentElement.setAttribute("data-theme", v);
          else document.documentElement.removeAttribute("data-theme");
          document
            .querySelectorAll("[data-theme]")
            .forEach((b) => b.tagName === "BUTTON" && b.setAttribute("aria-pressed", String(b.dataset.theme === v)));
        } else if (t.dataset.go && ids.includes(t.dataset.go)) {
          e.preventDefault();
          state.page = t.dataset.go;
          history.replaceState(null, "", "#" + state.page);
          go();
        } else if (t.parentElement && t.parentElement.dataset.toggle) {
          const seg = t.parentElement,
            i = [...seg.children].indexOf(t),
            key = seg.dataset.toggle;
          [...seg.children].forEach((c, j) => c.classList.toggle("on", j === i));
          const panes = seg.closest("section").querySelectorAll(`[data-${key}]`);
          panes.forEach((p, j) => (p.hidden = j !== i));
          fit();
        }
      });
      window.addEventListener("hashchange", () => {
        const h = location.hash.slice(1);
        if (ids.includes(h)) {
          state.page = h;
          go();
        }
      });
      let lastW = 0;
      new ResizeObserver(() => {
        const w = document.getElementById("stage").clientWidth;
        if (Math.abs(w - lastW) > 1) {
          lastW = w;
          fit();
        }
      }).observe(document.getElementById("stage"));
      if (!Object.keys(SHOTS).length) {
        const g = document.querySelector('[aria-label="Version"]');
        if (g) g.hidden = true;
        const h = document.getElementById("nowhint");
        if (h) h.hidden = true;
      }
      go();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    </script>
