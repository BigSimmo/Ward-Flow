# Weekly dependency updates, grouped so each ecosystem opens one minor/patch PR a week.
# Majors still arrive as their own PRs so a breaking change is reviewed on its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Perth
    open-pull-requests-limit: 5
    # axe 4.14 turns on label-content-name-mismatch, which flags about 30 existing components whose
    # aria-label leaves out their visible text. Held at 4.13 until those labels are fixed (October 2026).
    ignore:
      - dependency-name: "@axe-core/playwright"
        versions: [">=4.14.0"]
      - dependency-name: "axe-core"
        versions: [">=4.14.0"]
      # TypeScript 7.0 ships no compiler API and typescript-eslint does not support it yet.
      # Revisit at TypeScript 7.1.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      root-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /backend/ward-flow
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Perth
    open-pull-requests-limit: 3
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Perth
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
