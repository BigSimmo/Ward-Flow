# Security updates only (Josh, 24 October 2026). A limit of 0 turns off routine version-update PRs;
# Dependabot still opens a PR when a dependency has a published security advisory, grouped so each
# ecosystem's fixes arrive together. This needs "Dependabot security updates" switched on in the
# repository's Code security settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Perth
    open-pull-requests-limit: 0
    ignore:
      # TypeScript 7.0 ships no compiler API and typescript-eslint does not support it yet.
      # Revisit at TypeScript 7.1.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      root-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /backend/ward-flow
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Perth
    open-pull-requests-limit: 0
    groups:
      backend-security:
        applies-to: security-updates
        patterns: ["*"]

  # The local composite actions under .github/actions/ hold action pins too.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Perth
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
