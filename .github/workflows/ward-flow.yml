# Scope is verified before expensive runners are allocated; missing evidence blocks.
name: Ward Flow CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group: null
  workflow_dispatch: null
  schedule:
    - cron: 0 18 * * *
permissions:
  contents: read
concurrency:
  group: ward-flow-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    name: Ward Flow scope plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      unit: ${{ steps.plan.outputs.unit }}
      browser: ${{ steps.plan.outputs.browser }}
      policy: ${{ steps.plan.outputs.policy }}
      backend: ${{ steps.plan.outputs.backend }}
      build: ${{ steps.plan.outputs.build }}
      frontend_static: ${{ steps.plan.outputs.frontend_static }}
      dependency_review: ${{ steps.plan.outputs.dependency_review }}
      owner_index: ${{ steps.plan.outputs.owner_index }}
      rules_index: ${{ steps.plan.outputs.rules_index }}
      organisation: ${{ steps.plan.outputs.organisation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Record the Node and npm toolchain
        run: node --version && npm --version
      - name: Plan Ward scope
        id: plan
        env:
          WARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ward-ci-public/plan.mjs
      - name: Verify the scope plan against the diff
        env:
          WARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WARD_PLAN_FULL: ${{ steps.plan.outputs.full }}
          WARD_PLAN_UNIT: ${{ steps.plan.outputs.unit }}
          WARD_PLAN_BROWSER: ${{ steps.plan.outputs.browser }}
          WARD_PLAN_POLICY: ${{ steps.plan.outputs.policy }}
          WARD_PLAN_DEPENDENCY_REVIEW: ${{ steps.plan.outputs.dependency_review }}
          WARD_PLAN_OWNER_INDEX: ${{ steps.plan.outputs.owner_index }}
          WARD_PLAN_RULES_INDEX: ${{ steps.plan.outputs.rules_index }}
          WARD_PLAN_ORGANISATION: ${{ steps.plan.outputs.organisation }}
          WARD_PLAN_BACKEND: ${{ steps.plan.outputs.backend }}
          WARD_PLAN_BUILD: ${{ steps.plan.outputs.build }}
          WARD_PLAN_FRONTEND_STATIC: ${{ steps.plan.outputs.frontend_static }}
        run: node scripts/ward-ci-public/verify-plan.mjs
  reuse:
    name: Ward Flow main reuse check
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      verified: ${{ steps.check.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check for an identical tree already verified on its pull request
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          WARD_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/ward-ci-public/main-reuse.mjs
  static:
    name: Ward Flow static checks
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Record the Node and npm toolchain
        run: node --version && npm --version
      - name: Check CI contracts
        run: node scripts/ward-ci-public/check-contracts.mjs
      - name: Check synthetic fixture identifiers and disclaimer source
        run: node scripts/ward-flow/check-clinical-governance-gate.mjs
      - name: Check document links and anchors
        run: npm run docs:check-links
      - name: Check reference-pack integrity
        run: node scripts/ward-flow/maintain-docs-and-organisation.mjs --pack-only --check
      - name: Check maintained document commands
        run: npm run docs:check-scripts
      - name: Check doc facts and retired terms
        env:
          WARD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/doc-facts.mjs
      - name: Check owner rulings index
        if: ${{ needs.plan.outputs.owner_index == 'true' }}
        run: node scripts/ward-flow/owner-rulings-index.mjs --check
      - name: Check lessons rules index
        if: ${{ needs.plan.outputs.rules_index == 'true' }}
        run: node scripts/ward-flow/rules-index.mjs --check
      - name: Check file organisation
        if: ${{ needs.plan.outputs.organisation == 'true' }}
        run: node scripts/ward-flow/organisation.mjs --check --source working-tree
      - name: Review dependency changes
        if: ${{ github.event_name == 'pull_request' && needs.plan.outputs.dependency_review == 'true' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
      - name: Install locked dependencies
        id: install
        if: ${{ !cancelled() && needs.plan.outputs.full == 'true' }}
        run: node scripts/install-locked-dependencies.mjs
      - name: Check changed files
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          WARD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/ward-ci-public/changed-checks.mjs
      - name: Run the tests related to this PR's changes
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request' && needs.plan.outputs.unit == 'true' }}
        env:
          WARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ward-flow/related-tests.mjs --base "$WARD_BASE_SHA" --head HEAD --root .
      - name: Lint the whole tree
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.plan.outputs.frontend_static == 'true' }}
        run: node --max-old-space-size=8192 node_modules/eslint/bin/eslint.js src tests scripts playwright eslint.config.mjs next.config.ts playwright.config.ts vitest.config.mts --max-warnings 0 --no-error-on-unmatched-pattern
      - name: Check for new unused code
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.plan.outputs.frontend_static == 'true' }}
        env:
          KNIP_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: npm run check:knip
      - name: Check maintained policy contracts
        if: ${{ !cancelled() && needs.plan.outputs.policy == 'true' && steps.install.outcome == 'success' }}
        run: node scripts/ward-ci-public/check-policy-contracts.mjs
      - name: Check Ward reference data
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.plan.outputs.frontend_static == 'true' }}
        run: npm run check:ward-reference
      - name: Check Ward legal wording
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.plan.outputs.frontend_static == 'true' }}
        run: npm run check:ward-legal-language
      - name: Typecheck source and route types
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.plan.outputs.frontend_static == 'true' }}
        run: |
          node node_modules/next/dist/bin/next typegen
          node node_modules/typescript/bin/tsc -p tsconfig.json --noEmit --incremental false
      - name: Upload static check diagnostics
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ward-static-evidence-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
  backend:
    name: Ward Flow backend and shared production proof
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.backend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_DB: wardflow_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Record the Node and npm toolchain
        run: node --version && npm --version
      - name: Install locked dependencies
        id: install
        run: node scripts/install-locked-dependencies.mjs
      - name: Install locked Ward backend dependencies
        id: backend-install
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/install-locked-dependencies.mjs --root backend/ward-flow
      - name: Run Ward backend tests
        if: ${{ !cancelled() && steps.backend-install.outcome == 'success' }}
        working-directory: backend/ward-flow
        env:
          WARD_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/wardflow_test
        run: npm run build:engine && npm run typecheck && npm run test:coverage
      - name: Install Chromium for the shared-mode journey
        id: shared-chromium
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.backend-install.outcome == 'success' }}
        run: |
          node scripts/ward-ci-public/install-chromium.mjs
      - name: Run the shared-mode browser journey
        timeout-minutes: 20
        if: ${{ !cancelled() && steps.shared-chromium.outcome == 'success' }}
        env:
          WARD_E2E_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: node tests/support/ward-shared-mode-run.mjs
      - name: Upload backend and shared-mode evidence
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ward-backend-evidence-${{ github.run_id }}
          path: |
            test-results/
            coverage/backend/
          if-no-files-found: warn
          retention-days: 7
  unit:
    name: Ward Flow unit shard ${{ matrix.shard }}
    needs: [plan, reuse]
    if: ${{ !cancelled() && needs.plan.outputs.unit == 'true' && needs.reuse.outputs.verified != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Record the Node and npm toolchain
        run: node --version && npm --version
      - name: Install locked dependencies
        id: install
        run: node scripts/install-locked-dependencies.mjs
      - name: Select reproducible nightly fuzz window
        if: ${{ github.event_name == 'schedule' && steps.install.outcome == 'success' }}
        run: node scripts/ward-flow/engine-fuzz-window.mjs --output "$RUNNER_TEMP/ward-profile/fuzz-window.json" --github-env "$GITHUB_ENV"
      - name: Run reconciled unit suite shard
        id: shard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          WARD_GATE_SHARD: ${{ matrix.shard }}/8
          WARD_COVERAGE_BLOB_DIR: ${{ runner.temp }}/ward-coverage-blobs
          WARD_FULL_GATE_STATE_DIR: ${{ runner.temp }}/ward-unit-state
          WARD_TEST_PROFILE_DIR: ${{ runner.temp }}/ward-profile
          DEBUG: vitest:coverage
        run: npm run check:ward-expected-reds -- --print-signatures
      - name: Upload shard coverage blob
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ward-coverage-blob-${{ matrix.shard }}
          path: ${{ runner.temp }}/ward-coverage-blobs/blob-*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Upload unit diagnostics and preparation costs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ward-unit-diagnostics-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/ward-unit-state/
            ${{ runner.temp }}/ward-profile/
          if-no-files-found: warn
          overwrite: true
          retention-days: 3
  browser-build:
    name: Ward Flow prepared browser build
    needs: [plan, reuse]
    if: ${{ !cancelled() && needs.plan.outputs.browser == 'true' && needs.reuse.outputs.verified != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Record the Node and npm toolchain
        run: node --version && npm --version
      - name: Install locked dependencies
        id: install
        run: node scripts/install-locked-dependencies.mjs
      - name: Restore Next build cache
        id: next-cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/ward-next-cache
          key: ward-next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ward-next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts') }}-
      - name: Prepare the isolated browser build
        id: prepare
        env:
          WARD_GATE_BUILD: "1"
          WARD_BUILD_CACHE_DIR: ${{ runner.temp }}/ward-next-cache
          WARD_BROWSER_PREPARE_DIR: ${{ runner.temp }}/ward-browser-build
        run: npm run test:e2e:ward-journeys
      - name: Upload the verified browser build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ward-browser-build-${{ github.run_id }}
          path: ${{ runner.temp }}/ward-browser-build/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 3
          retention-days: 1
      - name: Save Next build cache (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.next-cache.outcome == 'success' && steps.next-cache.outputs.cache-hit != 'true' && steps.prepare.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/ward-next-cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
  browser:
    name: Ward Flow browser journeys ${{ matrix.group }}
    needs: [plan, reuse, browser-build]
    if: ${{ !cancelled() && needs.plan.outputs.browser == 'true' && needs.reuse.outputs.verified != 'true' && needs.browser-build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Record the Node and npm toolchain
        run: node --version && npm --version
      - name: Install locked dependencies
        id: install
        run: node scripts/install-locked-dependencies.mjs
      - name: Download the verified browser build
        if: ${{ !cancelled() && needs.browser-build.result == 'success' && steps.install.outcome == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ward-browser-build-${{ github.run_id }}
          path: ${{ runner.temp }}/ward-browser-build
      - name: Resolve the Playwright version
        id: playwright-version
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: playwright-cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: ward-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium
        id: chromium
        timeout-minutes: 8
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: node scripts/ward-ci-public/install-chromium.mjs
      - name: Save Playwright browsers
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' && steps.playwright-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: ward-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Run Ward browser journeys
        id: journeys
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        env:
          WARD_JOURNEY_GROUP: ${{ matrix.group }}/3
          WARD_GATE_BUILD: "1"
          WARD_BROWSER_ARTIFACT_DIR: ${{ needs.browser-build.result == 'success' && format('{0}/ward-browser-build', runner.temp) || '' }}
        run: npm run test:e2e:ward-journeys
      - name: Upload failed Ward browser evidence
        if: ${{ !cancelled() && steps.journeys.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ward-browser-failures-${{ github.run_id }}-${{ matrix.group }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 3
      - name: Report measured browser test costs
        if: ${{ !cancelled() && steps.journeys.outcome == 'success' }}
        run: node scripts/ward-flow/journey-durations.mjs --from-reports test-results > "$RUNNER_TEMP/ward-browser-costs.json"
      - name: Upload browser execution reports and costs
        if: ${{ !cancelled() && steps.journeys.outcome != 'skipped' && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ward-browser-reports-${{ matrix.group }}
          path: |-
            test-results/**/journeys.json
            test-results/**/shard-*.json
            ${{ runner.temp }}/ward-browser-costs.json
          if-no-files-found: warn
          retention-days: 7
  release-gate:
    name: Ward Flow release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Record the Node and npm toolchain
        run: node --version && npm --version
      - name: Install locked dependencies
        id: install
        run: node scripts/install-locked-dependencies.mjs
      - name: Download the verified browser build
        if: ${{ !cancelled() && needs.browser-build.result == 'success' && steps.install.outcome == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ward-browser-build-${{ github.run_id }}
          path: ${{ runner.temp }}/ward-browser-build
      - name: Resolve release browser version
        id: release-version
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore release browsers
        id: release-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: ward-release-browsers-${{ runner.os }}-chromium-webkit-${{ steps.release-version.outputs.version }}
      - name: Install Chromium and WebKit
        id: browsers
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/ward-ci-public/install-chromium.mjs chromium webkit
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.release-cache.outputs.cache-hit }}
      - name: Run the release-gate journeys
        id: gate
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        env:
          WARD_GATE_BUILD: "1"
          WARD_BROWSER_ARTIFACT_DIR: ${{ needs.browser-build.result == 'success' && format('{0}/ward-browser-build', runner.temp) || '' }}
        run: npm run test:e2e:release-gate
      - name: Upload failed release-gate evidence
        if: ${{ !cancelled() && steps.gate.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ward-release-gate-failures-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 3
      - name: Save release browsers on main
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' && steps.release-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: ward-release-browsers-${{ runner.os }}-chromium-webkit-${{ steps.release-version.outputs.version }}
    needs: [plan, browser-build]
    if: ${{ !cancelled() && needs.plan.outputs.browser == 'true' }}
  secret-scan:
    name: Ward Flow secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan git history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --exit-code 1 --gitleaks-ignore-path .gitleaksignore --log-opts="--full-history HEAD"
  build:
    name: Ward Flow production build
    needs: [plan, reuse]
    if: ${{ !cancelled() && needs.plan.outputs.build == 'true' && needs.reuse.outputs.verified != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Record the Node and npm toolchain
        run: node --version && npm --version
      - name: Install locked dependencies
        id: install
        run: node scripts/install-locked-dependencies.mjs
      - name: Restore Next build cache
        id: production-cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .next/cache
          key: ward-production-next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts') }}-${{ github.sha }}
          restore-keys: ward-production-next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts') }}-
      - name: Build for production (Railway build command)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --max-old-space-size=8192 node_modules/next/dist/bin/next build --webpack
      - name: Check the phone script budget
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-script-budget.mjs
      - name: Save production Next cache on main
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.production-cache.outcome == 'success' && steps.production-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .next/cache
          key: ${{ steps.production-cache.outputs.cache-primary-key }}
  coverage:
    name: Ward Flow coverage
    needs: [plan, reuse, unit]
    if: ${{ !cancelled() && needs.plan.outputs.unit == 'true' && needs.reuse.outputs.verified != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Record the Node and npm toolchain
        run: node --version && npm --version
      - name: Install locked dependencies
        id: install
        run: node scripts/install-locked-dependencies.mjs
      - name: Download shard coverage blobs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: ward-coverage-blob-*
          merge-multiple: true
          path: ${{ runner.temp }}/ward-shard-blobs
      - name: Merge shard coverage and enforce thresholds
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          WARD_SHARD_BLOBS: ${{ runner.temp }}/ward-shard-blobs
          WARD_SHARD_COUNT: "8"
        run: |
          for shard in $(seq 1 "$WARD_SHARD_COUNT"); do
            ls "$WARD_SHARD_BLOBS"/blob-shard-"$shard"-of-"$WARD_SHARD_COUNT"-batch-*.json
          done
          node node_modules/vitest/vitest.mjs run --merge-reports="$WARD_SHARD_BLOBS" --coverage
      - name: Check complete executable coverage inventory
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:coverage-inventory
      - name: Report measured unit test costs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          WARD_SHARD_BLOBS: ${{ runner.temp }}/ward-shard-blobs
        run: node scripts/ward-flow/unit-durations.mjs --from-blobs "$WARD_SHARD_BLOBS" --output "$RUNNER_TEMP/ward-unit-costs.json"
      - name: Upload final coverage and measured costs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ward-final-coverage-${{ github.run_id }}
          path: |
            coverage/
            ${{ runner.temp }}/ward-unit-costs.json
          if-no-files-found: warn
          retention-days: 7
  required:
    name: Ward Flow required
    if: always()
    needs: [plan, reuse, static, backend, unit, browser-build, browser, release-gate, secret-scan, build, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every Ward Flow job to succeed
        env:
          REUSE_VERIFIED: ${{ needs.reuse.outputs.verified }}
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          RELEASE_GATE_RESULT: ${{ needs.release-gate.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          REUSE_RESULT: ${{ needs.reuse.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          BACKEND_SCOPE: ${{ needs.plan.outputs.backend }}
          UNIT_SCOPE: ${{ needs.plan.outputs.unit }}
          BROWSER_SCOPE: ${{ needs.plan.outputs.browser }}
          BUILD_SCOPE: ${{ needs.plan.outputs.build }}
          BROWSER_BUILD_RESULT: ${{ needs.browser-build.result }}
        run: |
          set -euo pipefail
          require_scope() {
            if [ "$1" = true ]; then test "$2" = success;
            elif [ "$1" = false ]; then test "$2" = skipped;
            else return 1; fi
          }
          test "$PLAN_RESULT" = success
          test "$STATIC_RESULT" = success
          test "$SECRET_SCAN_RESULT" = success
          require_scope "$BACKEND_SCOPE" "$BACKEND_RESULT"
          require_scope "$BROWSER_SCOPE" "$RELEASE_GATE_RESULT"
          if [ "$REUSE_VERIFIED" = true ]; then
            test "$GITHUB_EVENT_NAME" = push
            test "$GITHUB_REF" = refs/heads/main
            test "$REUSE_RESULT" = success
            test "$UNIT_RESULT" = skipped
            test "$BROWSER_BUILD_RESULT" = skipped
            test "$BROWSER_RESULT" = skipped
            test "$BUILD_RESULT" = skipped
            test "$COVERAGE_RESULT" = skipped
          else
            require_scope "$UNIT_SCOPE" "$UNIT_RESULT"
            require_scope "$UNIT_SCOPE" "$COVERAGE_RESULT"
            require_scope "$BROWSER_SCOPE" "$BROWSER_BUILD_RESULT"
            require_scope "$BROWSER_SCOPE" "$BROWSER_RESULT"
            require_scope "$BUILD_SCOPE" "$BUILD_RESULT"
          fi
