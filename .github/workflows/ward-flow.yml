name: Ward Flow CI

on:
  pull_request:
    branches: [main]
  # Railway auto-deploys main, so every commit that lands on main gets its own full run. A push has
  # no PR base: the planner fails closed to the full scope, the PR-only steps (quick feedback,
  # dependency review, changed-file checks) skip themselves, and the full-tree lint covers lint.
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  # Nightly full run of main (02:00 AWST). Pushes to main can reuse their PR's verdict on an identical
  # tree (the reuse job below), so this keeps a regular full run of main on a fresh runner, which
  # also catches anything that drifts with time rather than with code.
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

# Pull requests share one group per PR and cancel superseded runs. Every other event (including
# each push to main) gets a group unique to its run, so a main run is never cancelled.
concurrency:
  group: ward-flow-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The checks run as parallel jobs rather than one serial job. Nothing is dropped: the unit suite is
# split into disjoint shards that together run every file, and the browser journey specs are split
# into disjoint groups, each on its own runner.
jobs:
  # Pushes to main only. Railway deploys a main commit once this workflow succeeds on it. When the
  # pushed tree is byte-for-byte a PR head whose own run already passed every unit shard, browser
  # group, the coverage thresholds and the production build (and that head contained the previous
  # main), those four jobs are skipped on main and the run still concludes success, so the deploy
  # proceeds. Anything short of that proof, including any error, reports verified=false and the full
  # suite runs. Static checks and the secret scan run on every main commit regardless.
  reuse:
    name: Ward Flow main reuse check
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      verified: ${{ steps.check.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner image's Node is enough for this dependency-free script; no install step that could
      # fail this job (a failed job would fail the run and Railway would skip the deploy).
      - name: Check for an identical tree already verified on its pull request
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          WARD_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/ward-ci-public/main-reuse.mjs

  static:
    name: Ward Flow static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Plan Ward scope
        id: plan
        env:
          WARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ward-ci-public/plan.mjs
      - name: Verify the scope plan against the diff
        env:
          WARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WARD_PLAN_FULL: ${{ steps.plan.outputs.full }}
          WARD_PLAN_UNIT: ${{ steps.plan.outputs.unit }}
          WARD_PLAN_BROWSER: ${{ steps.plan.outputs.browser }}
          WARD_PLAN_POLICY: ${{ steps.plan.outputs.policy }}
          WARD_PLAN_DEPENDENCY_REVIEW: ${{ steps.plan.outputs.dependency_review }}
        run: node scripts/ward-ci-public/verify-plan.mjs
      - name: Check CI contracts
        run: node scripts/ward-ci-public/check-contracts.mjs
      - name: Check maintained document commands
        run: npm run docs:check-scripts
      - name: Check Ward document links
        run: npm run check:ward-doc-links
      - name: Check maintained document links and anchors
        run: npm run docs:check-links
      - name: Check maintained architecture coverage
        run: npm run docs:check-index
      - name: Check script inventory
        run: npm run docs:check-inventory
      - name: Check Ward screen verification record
        run: node scripts/ward-flow/screen-verification.mjs --check
      - name: Review dependency changes
        if: ${{ github.event_name == 'pull_request' && steps.plan.outputs.dependency_review == 'true' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      - name: Install locked dependencies
        id: install
        if: ${{ !cancelled() && steps.plan.outputs.full == 'true' }}
        run: npm ci --ignore-scripts
      - name: Install locked Ward backend dependencies
        id: backend-install
        if: ${{ !cancelled() && steps.plan.outputs.full == 'true' && steps.plan.outputs.policy != 'true' && hashFiles('backend/ward-flow/package.json') != '' }}
        working-directory: backend/ward-flow
        run: npm ci --ignore-scripts
      - name: Run Ward backend tests
        if: ${{ !cancelled() && steps.backend-install.outcome == 'success' }}
        working-directory: backend/ward-flow
        run: npm test
      # Prettier and ESLint (errors) on the PR's changed files, plus the test-deletion guard.
      # Seconds, and pre-existing issues in untouched files never block the PR.
      - name: Check changed files
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          WARD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/ward-ci-public/changed-checks.mjs
      # Whole-tree ESLint (errors only) on every run, pull requests included. Enforcing since
      # 4 October 2026, when the 15 pre-existing errors were fixed. On a PR it catches what the
      # changed-file check above cannot: an ESLint config, rule or plugin change that breaks a file
      # the PR did not touch, which used to go red only on main. About a minute, off the critical path.
      - name: Lint the whole tree
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --max-old-space-size=8192 node_modules/eslint/bin/eslint.js src tests scripts playwright eslint.config.mjs next.config.ts playwright.config.ts vitest.config.mts --quiet --no-error-on-unmatched-pattern
      # Fast signal: only the tests that import the files this PR changed. --root makes it judge reds
      # against the expected-reds manifest exactly as the unit shards do, so it can only fail where a
      # shard would also fail. It shares this runner, which keeps two PRs' runs inside the
      # concurrent-runner limit.
      - name: Run the tests related to this PR's changes
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          WARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ward-flow/related-tests.mjs --base "$WARD_BASE_SHA" --head HEAD --root .
      - name: Check maintained policy contracts
        if: ${{ !cancelled() && steps.plan.outputs.policy == 'true' && steps.install.outcome == 'success' }}
        run: node scripts/ward-ci-public/check-policy-contracts.mjs
      - name: Check Ward reference data
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.plan.outputs.policy != 'true' }}
        run: npm run check:ward-reference
      - name: Check Ward legal wording
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.plan.outputs.policy != 'true' }}
        run: npm run check:ward-legal-language
      # next typegen writes the route types and validator that `next build` checks, so this one
      # type check covers source and route signatures. The browser builds then skip their own copy.
      - name: Typecheck source and route types
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.plan.outputs.policy != 'true' }}
        run: |
          node node_modules/next/dist/bin/next typegen
          node node_modules/typescript/bin/tsc -p tsconfig.json --noEmit --incremental false

  unit:
    name: Ward Flow unit shard ${{ matrix.shard }}
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.verified != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # Every shard reports, so one red never hides another shard's result.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Plan Ward scope
        id: plan
        env:
          WARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ward-ci-public/plan.mjs
      - name: Install locked dependencies
        id: install
        if: ${{ !cancelled() && steps.plan.outputs.unit == 'true' }}
        run: npm ci --ignore-scripts
      # Each shard also records V8 coverage for its own files into a Vitest blob report. The coverage
      # job merges the five blobs and applies the vitest.config.mts thresholds to the whole suite, so
      # the unit suite runs once instead of a second time in a single coverage job.
      - name: Run reconciled unit suite shard
        id: shard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          WARD_GATE_SHARD: ${{ matrix.shard }}/5
          WARD_COVERAGE_BLOB_DIR: ${{ runner.temp }}/ward-coverage-blobs
        run: npm run check:ward-expected-reds -- --print-signatures
      - name: Upload shard coverage blob
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # One name per shard, replaced on a re-run, so a re-run shard's stale blob is never merged.
          name: ward-coverage-blob-${{ matrix.shard }}
          path: ${{ runner.temp }}/ward-coverage-blobs/blob-*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  browser:
    name: Ward Flow browser journeys ${{ matrix.group }}
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.verified != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Plan Ward scope
        id: plan
        env:
          WARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ward-ci-public/plan.mjs
      - name: Install locked dependencies
        id: install
        if: ${{ !cancelled() && steps.plan.outputs.browser == 'true' }}
        run: npm ci --ignore-scripts
      # Browser binaries are cached per Playwright version (the binary revision is pinned to it).
      # Only runs on main save the entry, so pull requests restore main's copy and never add their
      # own to the repository's cache storage. The system libraries still install every run.
      - name: Resolve the Playwright version
        id: playwright-version
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: playwright-cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ward-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium
        id: chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$PLAYWRIGHT_CACHE_HIT" = "true" ]; then
            npx playwright install-deps chromium
            # A no-op when the cached revision is complete; repairs a partial entry otherwise.
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Save Playwright browsers
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' && steps.playwright-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ward-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Restore Next build cache
        id: next-cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Restore on every event; save (below) only on main. Per-SHA PR entries were
        # ~8 GB of the 10 GB Actions cache and nothing reused them. PRs still get main's entry
        # through the restore-keys prefix, since a PR can read its base branch's cache.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ward-next-cache
          key: ward-next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ward-next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts') }}-
      - name: Run Ward browser journeys
        id: journeys
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        env:
          # One duration-balanced third of the journey specs per runner, one worker each, so no
          # runner shares its CPU with another browser. The three groups cover every spec once.
          WARD_JOURNEY_GROUP: ${{ matrix.group }}/3
          # The static job type-checks source and route types on this same commit (next typegen),
          # so the test builds skip that 40-second step. Next validates every cache entry against
          # the source, so the warm build cache changes speed, not what is built.
          WARD_GATE_BUILD: "1"
          WARD_BUILD_CACHE_DIR: ${{ runner.temp }}/ward-next-cache
        run: npm run test:e2e:ward-journeys
      - name: Save Next build cache (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.next-cache.outcome == 'success' && steps.next-cache.outputs.cache-hit != 'true' && steps.journeys.outcome != 'skipped' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ward-next-cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
      - name: Upload failed Ward browser evidence
        if: ${{ !cancelled() && steps.journeys.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ward-browser-failures-${{ github.run_id }}-${{ matrix.group }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 3

  secret-scan:
    # Full-history secret scan with a pinned, checksum-verified gitleaks release binary (no
    # third-party action, licence key or token). It scans every commit reachable from the checked
    # out commit and honours the reviewed fingerprints in .gitleaksignore. Findings are redacted.
    name: Ward Flow secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan git history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --exit-code 1 --gitleaks-ignore-path .gitleaksignore --log-opts="--full-history HEAD"

  build:
    # The deploy build: Railway's exact build command, without WARD_GATE_BUILD, so Next.js runs its
    # own type and build checks. The browser jobs' WARD_GATE_BUILD builds ignore build errors.
    name: Ward Flow production build
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.verified != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Railway builds with Node 24.19.0 (docs/hosting.md, RAILPACK_NODE_VERSION); match it here.
          node-version: "24.19.0"
          cache: npm
      - name: Plan Ward scope
        id: plan
        env:
          WARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ward-ci-public/plan.mjs
      - name: Install locked dependencies
        id: install
        if: ${{ !cancelled() && steps.plan.outputs.full == 'true' && steps.plan.outputs.policy != 'true' }}
        run: npm ci --ignore-scripts
      - name: Build for production (Railway build command)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --max-old-space-size=8192 node_modules/next/dist/bin/next build --webpack

  coverage:
    # Enforces the vitest.config.mts coverage thresholds over the whole unit suite. On 4 October 2026
    # a local run met them (all files 61.59% statements, 62.64% branches, 67.14% functions, 62.62%
    # lines, plus the scoped core thresholds). The unit shards record coverage for their own files;
    # this job merges all five blob reports and judges the merged result against the same thresholds
    # (this job never sets the shard coverage directory, so the config keeps them). A missing shard blob
    # fails the job rather than quietly lowering the percentage.
    name: Ward Flow coverage
    needs: [reuse, unit]
    if: ${{ !cancelled() && needs.reuse.outputs.verified != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Plan Ward scope
        id: plan
        env:
          WARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ward-ci-public/plan.mjs
      - name: Install locked dependencies
        id: install
        if: ${{ !cancelled() && steps.plan.outputs.unit == 'true' }}
        run: npm ci --ignore-scripts
      - name: Download shard coverage blobs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: ward-coverage-blob-*
          merge-multiple: true
          path: ${{ runner.temp }}/ward-shard-blobs
      - name: Merge shard coverage and enforce thresholds
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          WARD_SHARD_BLOBS: ${{ runner.temp }}/ward-shard-blobs
          # Must equal the count in the unit job's WARD_GATE_SHARD (checked by check-contracts.mjs).
          WARD_SHARD_COUNT: "5"
        run: |
          for shard in $(seq 1 "$WARD_SHARD_COUNT"); do
            ls "$WARD_SHARD_BLOBS"/blob-shard-"$shard"-of-"$WARD_SHARD_COUNT"-batch-*.json
          done
          node node_modules/vitest/vitest.mjs run --merge-reports="$WARD_SHARD_BLOBS" --coverage

  required:
    name: Ward Flow required
    if: always()
    needs: [reuse, static, unit, browser, secret-scan, build, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The second branch is main only: the reuse job proved this exact tree passed those four jobs on
      # its pull request, so they must be skipped here (not failed or cancelled), and static checks and
      # the secret scan must still have passed on this commit.
      - name: Require every Ward Flow job to succeed
        env:
          REUSE_VERIFIED: ${{ needs.reuse.outputs.verified }}
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          if [ "$REUSE_VERIFIED" != true ]; then
            test "$STATIC_RESULT" = success && test "$UNIT_RESULT" = success && test "$BROWSER_RESULT" = success && test "$SECRET_SCAN_RESULT" = success && test "$BUILD_RESULT" = success && test "$COVERAGE_RESULT" = success
          else
            test "$STATIC_RESULT" = success && test "$SECRET_SCAN_RESULT" = success && test "$UNIT_RESULT" = skipped && test "$BROWSER_RESULT" = skipped && test "$BUILD_RESULT" = skipped && test "$COVERAGE_RESULT" = skipped
          fi
