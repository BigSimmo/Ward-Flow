name: babysit-147-restore-exc
on:
  push:
    paths:
      - "docs/ward-flow/.babysit-147-exc/**"
    branches:
      - claude/wizardly-maxwell-wpckq8
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/wizardly-maxwell-wpckq8
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore exception-drawer and merge main
        run: |
          set -euo pipefail
          git config user.name "Ward Flow Babysit"
          git config user.email "ward-flow-babysit@users.noreply.github.com"
          if [ -f docs/ward-flow/.babysit-147-exc/exception-drawer.zb64 ]; then
            python3 - <<'PY'
          import base64, zlib, pathlib
          p = pathlib.Path("docs/ward-flow/.babysit-147-exc/exception-drawer.zb64")
          out = pathlib.Path("src/components/ward-management/coordinator/exception-drawer.tsx")
          out.write_bytes(zlib.decompress(base64.b64decode(p.read_text().strip())))
          print(out, out.stat().st_size)
          PY
            test "$(wc -c < src/components/ward-management/coordinator/exception-drawer.tsx)" -gt 10000
            grep -q ExceptionDrawer src/components/ward-management/coordinator/exception-drawer.tsx
            git add src/components/ward-management/coordinator/exception-drawer.tsx
            git commit -m "Babysit #147: restore exception-drawer.tsx" || true
          fi
          if [ -f docs/ward-flow/.babysit-147-exc/do-merge-main ]; then
            git fetch origin main
            for pair in \
              "ward-history.test.ts:tests/ward-history.test.ts" \
              "patient-dossier-tabs.tsx:src/components/ward-management/patients/patient-dossier-tabs.tsx" \
              "patient-now-screen.tsx:src/components/ward-management/patients/patient-now-screen.tsx" \
              "patient-status-card.tsx:src/components/ward-management/patients/patient-status-card.tsx"
            do
              src="${pair%%:*}"
              dest="${pair##*:}"
              zb="docs/ward-flow/.babysit-147-exc/${src}.zb64"
              if [ -f "$zb" ]; then
                python3 - "$zb" "$dest" <<'PY'
          import base64, zlib, pathlib, sys
          pathlib.Path(sys.argv[2]).write_bytes(zlib.decompress(base64.b64decode(pathlib.Path(sys.argv[1]).read_text().strip())))
          print(sys.argv[2])
          PY
                git add "$dest"
              fi
            done
            git commit -m "Babysit #147: stage merge conflict resolutions" || true
            if git merge origin/main --no-edit; then
              echo clean merge
            else
              for pair in \
                "ward-history.test.ts:tests/ward-history.test.ts" \
                "patient-dossier-tabs.tsx:src/components/ward-management/patients/patient-dossier-tabs.tsx" \
                "patient-now-screen.tsx:src/components/ward-management/patients/patient-now-screen.tsx" \
                "patient-status-card.tsx:src/components/ward-management/patients/patient-status-card.tsx"
              do
                src="${pair%%:*}"
                dest="${pair##*:}"
                zb="docs/ward-flow/.babysit-147-exc/${src}.zb64"
                if [ -f "$zb" ]; then
                  python3 - "$zb" "$dest" <<'PY'
          import base64, zlib, pathlib, sys
          pathlib.Path(sys.argv[2]).write_bytes(zlib.decompress(base64.b64decode(pathlib.Path(sys.argv[1]).read_text().strip())))
          PY
                  git add "$dest"
                fi
              done
              if git grep -n '<<<<<<<' -- ':!docs/ward-flow/.babysit-147*' ; then
                echo unresolved; exit 1
              fi
              git commit --no-edit || git commit -m "Babysit #147: merge origin/main with resolutions"
            fi
          fi
          rm -rf docs/ward-flow/.babysit-147-exc
          rm -f .github/workflows/babysit-147-restore-exc.yml
          git add -A
          git commit -m "Babysit #147: remove restore helper artifacts" || true
          git push origin HEAD:claude/wizardly-maxwell-wpckq8
