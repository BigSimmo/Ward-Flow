name: Ward Flow CI tidy

# Frees shared runner slots (ci-tidy.mjs): cancels runs for merged or closed pull requests, and runs
# for an older head of an open PR while nothing in them is running. It no longer runs on each PR push:
# the only pull_request workflow is Ward Flow CI, whose concurrency group already cancels a
# superseded head's run, so that trigger only spent a job slot per push (4 Nov 2026). The hourly
# schedule is the backstop for a missed close event. Running checks on a current head
# are never cancelled. pull_request_target runs in the base repository's context, so this checks out
# only main's script and never runs pull-request code. Free GitHub-hosted runners only.
on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: null

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: ward-flow-ci-tidy
  cancel-in-progress: false

jobs:
  tidy:
    name: Ward Flow CI tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out main's tidy script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ward-ci-public/ci-tidy.mjs
          sparse-checkout-cone-mode: false
          ref: main
      - name: Cancel runs nobody will use
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ward-ci-public/ci-tidy.mjs
