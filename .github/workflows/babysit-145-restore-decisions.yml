name: babysit-145-restore-decisions
on:
  push:
    paths:
      - "docs/ward-flow/.restore-parts/**"
    branches:
      - claude/brave-wright-aiqisd
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/brave-wright-aiqisd
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble decisions.md from parts when complete
        run: |
          set -euo pipefail
          if [ ! -f docs/ward-flow/.restore-parts/part-21.txt ]; then
            echo "Waiting for all parts"; exit 0
          fi
          cat docs/ward-flow/.restore-parts/part-*.txt > docs/ward-flow/decisions.md
          wc -c docs/ward-flow/decisions.md
          rm -rf docs/ward-flow/.restore-parts
          rm -f .github/workflows/babysit-145-restore-decisions.yml
          git config user.name "Ward Flow Babysit"
          git config user.email "ward-flow-babysit@users.noreply.github.com"
          git add -A
          git commit -m "Babysit #145: restore decisions.md with D-38/D-39 merge resolution"
          git push origin HEAD:claude/brave-wright-aiqisd
