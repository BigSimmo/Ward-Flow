name: babysit-147-resolve-merge
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/babysit-147-resolve-merge.yml"
    branches:
      - claude/wizardly-maxwell-wpckq8
jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/wizardly-maxwell-wpckq8
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge main and resolve conflicts
        run: |
          set -euo pipefail
          git config user.name "Ward Flow Babysit"
          git config user.email "ward-flow-babysit@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge origin/main -m "Merge origin/main into patient-page branch"
          merge_rc=$?
          set -e

          # Tip had a PLACEHOLDER corruption; keep main's drawer.
          git checkout --theirs -- src/components/ward-management/coordinator/exception-drawer.tsx
          git add src/components/ward-management/coordinator/exception-drawer.tsx

          python3 <<'PY'
          from pathlib import Path
          import re
          path = Path("tests/ward-history.test.ts")
          text = path.read_text()
          if "<<<<<<<" not in text:
              print("ward-history already clean")
          else:
              new = '''    it("classifies all 104 event types into bed, patient, both or neither with plain wording", () => {
                const allEventTypes = Object.keys(EVENT_ROLE) as Array<WardFlowEvent["type"]>;
                // 97 -> 96 on 2026-09-25: OVERRIDE_LEGAL_MISMATCH removed (owner ruling).
                // D-34 adds the explicit ED medical deterioration transition. D-38 adds four: absent without
                // leave, its steps, and recording or ending a community treatment order.
                // 9 Oct 2026: RECORD_SUPPORT_NOTIFICATION (advisory carer/PSP/MHAS checklist).
                expect(allEventTypes.length).toBe(104);'''
              pat = re.compile(r"<<<<<<< HEAD.*?>>>>>>> origin/main", re.S)
              m = pat.search(text)
              if not m:
                  raise SystemExit("conflict block not found in ward-history.test.ts")
              path.write_text(pat.sub(new, text, count=1))
              print("resolved ward-history to 104")
          if "<<<<<<<" in path.read_text():
              raise SystemExit("leftover conflict markers")
          PY
          git add tests/ward-history.test.ts

          # Fail if any other unresolved conflicts remain
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts:"; git diff --name-only --diff-filter=U; exit 1
          fi

          git add -A
          if [ "$merge_rc" -ne 0 ]; then
            git commit -m "Merge origin/main into patient-page branch

          Restore exception-drawer from main (tip was a placeholder). History event
          count is 104 after D-38 absence/CTO events plus RECORD_SUPPORT_NOTIFICATION."
          else
            if ! git diff --cached --quiet; then
              git commit -m "Babysit #147: finish main merge resolution"
            fi
          fi

          rm -f .github/workflows/babysit-147-resolve-merge.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Babysit #147: remove resolve-merge workflow"
          fi
          git push origin HEAD:claude/wizardly-maxwell-wpckq8
