name: Ward Flow backend uptime

# Audit F-06 (approved by Josh, 19 October 2026; database check and test alert approved 20 October).
# Every 30 minutes, asks the hosted shared backend whether it is up and can reach its database.
# When either stays down across three tries, opens one "backend down" issue that @mentions the
# owner, so GitHub emails him; when both answer again, comments and closes that issue. An issue is
# used because GitHub sends a failed scheduled run's own email only to whoever last edited the
# schedule, which may not be the owner. Only the backend is checked: the signed-in site sleeps when
# idle, and a check every 30 minutes would keep it awake. `/healthz` needs no sign-in; sent the
# WARD_FLOW_UPTIME_TOKEN repo secret (audit P177), it reports `database` as "ok" or "unavailable"
# from a check it repeats at most every 30 seconds. A missing or wrong token hides `database`: that
# counts as up and shows a warning on the run, not a "database down" issue (`/readyz`
# needs a sign-in). Run it by hand with "Send one test alert" ticked to check the email arrives: it
# opens and at once closes one clearly labelled test issue and skips the real check.
# Public repository: free. GitHub turns scheduled workflows off after 60 days without repository
# activity.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send one test alert (opens and closes a labelled test issue; skips the real check)
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: ward-backend-uptime
  cancel-in-progress: false

jobs:
  uptime:
    name: Ward Flow backend uptime
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BACKEND_URL: https://ward-flow-backend-production.up.railway.app
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: backend-down
      OWNER: BigSimmo
    steps:
      - name: Send one test alert
        if: ${{ inputs.test_alert }}
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create uptime-test --color C5DEF5 --description "Uptime alert test; no action needed" --force
          url=$(gh issue create --label uptime-test --title "TEST ONLY: Ward Flow backend alert check (no action needed)" --body "@$OWNER This is a test of the backend uptime alert, sent by hand ($run). Nothing is wrong. If you got this as an email, real alerts will reach you too. This issue closes itself straight away.")
          gh issue close "$url" --comment "Test finished; closed automatically."
      - name: Ask the backend whether it is up and can reach its database
        if: ${{ !inputs.test_alert }}
        id: check
        env:
          # Audit P177: /healthz shows the database answer only to a caller holding this token.
          UPTIME_TOKEN: ${{ secrets.WARD_FLOW_UPTIME_TOKEN }}
        run: |
          state=down
          for attempt in 1 2 3; do
            body=$(curl --silent --show-error --max-time 20 --fail --header "x-ward-flow-uptime-token: $UPTIME_TOKEN" "$BACKEND_URL/healthz" || true)
            if printf '%s' "$body" | grep -q '"service":"ward-flow-backend"'; then
              # A missing `database` means the token was missing or wrong: the public health check
              # still passed, so count the backend as up and warn about the token instead of raising
              # a false "database down" issue.
              database=$(printf '%s' "$body" | jq -r '.database // "hidden"' 2>/dev/null || echo hidden)
              if [ "$database" = "ok" ]; then state=up; break; fi
              if [ "$database" = "hidden" ]; then
                echo "::warning::Database not checked: WARD_FLOW_UPTIME_TOKEN is missing or does not match the backend's value."
                state=up
                break
              fi
              state=database
            else
              state=down
            fi
            [ "$attempt" -lt 3 ] && sleep 31
          done
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "Backend state: $state"
      - name: Raise or close the backend-down issue
        if: ${{ !inputs.test_alert }}
        run: |
          open=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "${{ steps.check.outputs.state }}" = "up" ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "@$OWNER The shared backend and its database are answering again ($run)."
              gh issue close "$open"
            fi
            exit 0
          fi
          if [ -z "$open" ]; then
            gh label create "$LABEL" --color B60205 --description "Hosted backend not answering" --force
            if [ "${{ steps.check.outputs.state }}" = "database" ]; then
              gh issue create --label "$LABEL" --title "Shared backend cannot reach its database" --body "@$OWNER The hosted Ward Flow backend answered, but reported its database unavailable three times in a row ($BACKEND_URL/healthz, $run). Shared mode will not load or save until the database is back. Check the Supabase project and the ward-flow-backend service in Railway. This issue closes itself when both answer again."
            else
              gh issue create --label "$LABEL" --title "Shared backend is not answering" --body "@$OWNER The hosted Ward Flow backend ($BACKEND_URL/healthz) did not answer three times in a row ($run). Shared mode will not load or save until it is back. Check the ward-flow-backend service in Railway. This issue closes itself when the backend answers again."
            fi
          fi
          exit 1
