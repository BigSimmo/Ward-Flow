    <meta charset="utf-8" />

    <title>All pages overview</title>
    <style>
      @font-face {
        font-family: "Geist";
        src: url("m/geist-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      :root {
        --bg: #e8ecf0;
        --panel: #fdfdfe;
        --fg: #161e28;
        --muted: #414953;
        --line: #d5dbe2;
        --accent: #245a8c;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0d141b;
          --panel: #141d26;
          --fg: #e8edf2;
          --muted: #bcc8d4;
          --line: #2c3540;
          --accent: #7fb6e6;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0d141b;
        --panel: #141d26;
        --fg: #e8edf2;
        --muted: #bcc8d4;
        --line: #2c3540;
        --accent: #7fb6e6;
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.4 "Geist",
          system-ui,
          sans-serif;
      }
      main {
        padding-block: 16px 32px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
      }
      h2 {
        font-size: 14px;
        margin: 20px 0 10px;
        letter-spacing: 0.02em;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
        gap: 14px;
      }
      a {
        color: inherit;
        text-decoration: none;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      a:hover,
      a:focus-visible {
        border-color: var(--accent);
        outline: none;
      }
      img {
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
        object-position: top;
        display: block;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
      }
      .cap {
        padding: 7px 10px;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .cap span {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
    </style>
  </head>

      };
      const m = document.getElementById("m");
      let g = null,
        grid;
      // The hub moves the archived "As ..." role views to the end (Q156), so map each card to the hub's index.
      const HUB = [];
      {
        const rest = [],
          arch = [];
        ALL.forEach((r, i) => (r[1].startsWith("As ") ? arch : rest).push(i));
        [...rest, ...arch].forEach((orig, hub) => {
          HUB[orig] = hub;
        });
      }
      ALL.forEach(([l, gr, dir], i) => {
        if (gr !== g) {
          g = gr;
          const h = document.createElement("h2");
          h.textContent = gr;
          grid = document.createElement("div");
          grid.className = "grid";
          m.append(h, grid);
        }
        const a = document.createElement("a");
        a.href = `index.html#all/${HUB[i]}`;
        a.onclick = (e) => {
          try {
            if (parent !== window) {
              e.preventDefault();
              parent.location.hash = `all/${HUB[i]}`;
            }
          } catch (x) {}
        };
        a.innerHTML = `<img loading="lazy" src="th/${i}.jpg" alt=""><div class="cap"><b></b><span>${NOTE[dir]}</span></div>`;
        a.querySelector("b").textContent = `${i + 1}. ${l}`;
        a.querySelector("img").alt = l;
