<meta name="robots" content="noindex" />
<title>Ward Flow Master Design</title>
<style>
  @font-face {
    font-family: "Geist";
    src: url("m/geist-latin.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  :root {
    --bg: #e8ecf0;
    --panel: #fdfdfe;
    --fg: #161e28;
    --muted: #414953;
    --line: #d5dbe2;
    --accent: #1f6f8b;
    --accent-ink: #ffffff;
    --ui: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d141b;
      --panel: #141d26;
      --fg: #e8edf2;
      --muted: #bcc8d4;
      --line: #2c3540;
      --accent: #5fb3cf;
      --accent-ink: #0b1216;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d141b;
    --panel: #141d26;
    --fg: #e8edf2;
    --muted: #bcc8d4;
    --line: #2c3540;
    --accent: #5fb3cf;
    --accent-ink: #0b1216;
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 var(--ui);
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 10px max(16px, env(safe-area-inset-left)) 0;
  }
  .top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
  }
  h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
  }
  .spacer {
    flex: 1;
  }
  .lab {
    font-size: 12px;
    color: var(--muted);
  }
  .seg {
    display: inline-flex;
  }
  button,
  select,
  a.btn {
    font: inherit;
    font-size: 13px;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    min-height: 32px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
  }
  .seg button {
    border-radius: 0;
    margin-left: -1px;
  }
  .seg button:first-child {
    border-radius: 8px 0 0 8px;
    margin-left: 0;
  }
  .seg button:last-child {
    border-radius: 0 8px 8px 0;
  }
  button[aria-pressed="true"],
  button[aria-selected="true"] {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  nav {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding: 10px 0;
    scrollbar-width: thin;
  }
  nav button {
    white-space: nowrap;
    border-radius: 999px;
  }
  nav .sep {
    width: 1px;
    background: var(--line);
    margin: 4px 6px;
    flex: none;
  }
  .info {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    align-items: center;
    padding: 8px max(16px, env(safe-area-inset-left));
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    font-size: 13px;
  }
  .info .src {
    color: var(--muted);
  }
  .info select {
    max-width: 60vw;
  }
  #views {
    display: inline-flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    color: var(--muted);
  }
  main {
    flex: 1;
    min-height: 0;
    padding: 12px 16px;
    overflow: auto;
  }
  .stage {
    margin: 0 auto;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    position: relative;
  }
  iframe {
    border: 0;
    display: block;
    transform-origin: 0 0;
    background: #fff;
  }
  .pic {
    max-width: 100%;
    display: block;
    margin: 0 auto;
    border-radius: 10px;
    border: 1px solid var(--line);
  }
</style>
<header>
  <div class="top">
    <h1>Ward Flow master design</h1>
    <span class="lab">Synthetic demo data only</span>
    <span class="spacer"></span>
    <span class="lab">Width</span><span class="seg" id="width"></span> <span class="lab">Theme</span

      status: "Open (#1224)",
      src: "Josh's Patient Screen Redesign.zip.",
      views: ["now", "history", "community", "details", "documents"].flatMap((tab) =>
        [
          ["PT-003", "On ward"],
          ["PT-013", "In transit"],
          ["PT-036", "On leave"],
          ["PT-029", "In ED"],
        ].map(([p, w]) => [`${w}: ${tab}`, F("pa", "patient", `&patient=${p}&tab=${tab}`)]),
      ),
    },
    {
      id: "statistics",
      label: "Statistics / Weekly",
      status: "Building (#1243 Weekly)",
      src: "statistics-hifi build, all seven tabs; figures are illustrative.",
      views: [
        ["Overview", F("st", "statistics")],
        ["Compare", F("st", "statistics-compare")],
        ["Services", F("st", "statistics-services")],
        ["Wards", F("st", "statistics-wards")],
        ["EDs", F("st", "statistics-eds")],
        ["Teams", F("st", "statistics-teams")],
        ["Weekly", F("st", "statistics-weekly")],
      ],
    },
  ];
  const WIDTHS = [1440, 1280, 820, 390];
  const HEIGHTS = { 1440: 900, 1280: 800, 820: 1180, 390: 844 };
  const state = { s: 0, v: 0, w: 1440, theme: "light" };
  try {
    const k = JSON.parse(localStorage.getItem("wf-master") || "{}");
    if (WIDTHS.includes(k.w)) state.w = k.w;
    if (k.theme === "dark") state.theme = "dark";
  } catch (e) {}
  const fromHash = () => {
    const [id, v] = location.hash.slice(1).split("/");
    const i = SECTIONS.findIndex((x) => x.id === id);
    if (i >= 0) {
      state.s = i;
      state.v = Math.max(0, Math.min(Number(v) || 0, SECTIONS[i].views.length - 1));
    }
  };
  fromHash();
  const $ = (id) => document.getElementById(id);

  function seg(el, items, key) {
    el.innerHTML = "";
    for (const [value, label] of items) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = label;
      b.setAttribute("aria-pressed", String(state[key] === value));
      b.onclick = () => {
        state[key] = value;
        render();
      };
      el.append(b);
    }
  }
  const tabs = $("tabs");
  SECTIONS.forEach((s, i) => {
    if (i === 4 || i === 6) {
      const d = document.createElement("span");
      d.className = "sep";
      tabs.append(d);
    }
    const b = document.createElement("button");
    b.type = "button";
    b.role = "tab";
    b.textContent = s.label;
    b.dataset.i = i;
    b.onclick = () => {
      state.s = i;
      state.v = 0;
      render();
      b.scrollIntoView({ block: "nearest", inline: "nearest" });
    };
    tabs.append(b);
  });

  let last = "";
  function render() {
    const s = SECTIONS[state.s];
    document.documentElement.dataset.theme = state.theme;
    for (const b of tabs.querySelectorAll("button"))
      b.setAttribute("aria-selected", String(Number(b.dataset.i) === state.s));
    seg(
      $("width"),
      WIDTHS.map((w) => [w, String(w)]),
      "w",
    );
    seg(
      $("theme"),
      [
        ["light", "Light"],
        ["dark", "Dark"],
      ],
      "theme",
    );
    const views = $("views");
    views.innerHTML = "";
    if (s.views.length > 1) {
      const sel = document.createElement("select");
      sel.setAttribute("aria-label", "View");
      let grp = null,
        og = null;
      s.views.forEach(([l, , g], i) => {
        if (g && g !== grp) {
          grp = g;
          og = document.createElement("optgroup");
          og.label = g;
          sel.append(og);
        }
        const o = document.createElement("option");
        o.value = i;
        o.textContent = l;
        (g ? og : sel).append(o);
      });
      sel.value = state.v;
      sel.onchange = () => {
        state.v = Number(sel.value);
        render();
      };
      const step = (d) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = d < 0 ? "Previous" : "Next";
        b.onclick = () => {
          state.v = (state.v + d + s.views.length) % s.views.length;
          render();
        };
        return b;
      };
      views.append(step(-1), sel, step(1), ` ${state.v + 1} of ${s.views.length} `);
    }
    $("status").textContent = s.status;
    $("src").textContent = s.views[state.v][3] ? `From the ${s.views[state.v][3]}.` : s.src;
    const url = s.views[state.v][1](state.theme);
    $("open").href = url;
    try {
      localStorage.setItem("wf-master", JSON.stringify({ w: state.w, theme: state.theme }));
    } catch (e) {}
    const h = `#${s.id}/${state.v}`;
    if (location.hash !== h) history.replaceState(null, "", h);
    const isPic = url.endsWith(".png");
    $("stage").hidden = isPic;
    $("pic").hidden = !isPic;
    if (isPic) {
      $("pic").src = url;
      $("pic").alt = s.views[state.v][0];
      return;
    }
    if (url !== last) {
      $("frame").src = url;
      last = url;
    }
    layout();
  }
  function layout() {
    const s = SECTIONS[state.s],
      f = $("frame"),
      st = $("stage");
    const avail = Math.max(200, $("main").clientWidth - 32);
    if (s.kit) {
      f.style.transform = "";
      f.style.width = "100%";
      st.style.width = "100%";
      f.style.height = st.style.height = Math.max(400, $("main").clientHeight - 26) + "px";
      return;
    }
    const k = Math.min(1, avail / state.w);
    const viewH = Math.max(300, $("main").clientHeight - 26);
    f.style.width = state.w + "px";
    f.style.height = Math.round(viewH / k) + "px";
    f.style.transform = `scale(${k})`;
    st.style.width = Math.round(state.w * k) + "px";
    st.style.height = viewH + "px";
  }
  window.addEventListener("resize", layout);
  window.addEventListener("hashchange", () => {
    fromHash();
    render();
  });
  render();
</script>
